{% extends 'base.html' %}
{% block content %}
<h2>Edit Profile</h2>
<form method="post">{% csrf_token %}
  {% for field in form %}
    <label>{{ field.label }}</label>{{ field }}{{ field.errors }}
  {% endfor %}
  <button type="submit">Save</button>
  <a href="{% url 'profile' %}">Cancel</a>
</form>
{% endblock %}
