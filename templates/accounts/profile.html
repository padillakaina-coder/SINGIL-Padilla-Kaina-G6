{% extends 'base.html' %}
{% block content %}
<h2>My Profile</h2>
<p><strong>Name:</strong> {{ user.first_name }} {{ user.last_name }}</p>
<p><strong>Email:</strong> {{ user.email }}</p>
<p><strong>Contact number:</strong> {{ user.contact_number|default:"—" }}</p>
<p><strong>Role:</strong> {{ user.get_role_display }}</p>
<a href="{% url 'profile_edit' %}">Edit profile</a>
{% endblock %}
