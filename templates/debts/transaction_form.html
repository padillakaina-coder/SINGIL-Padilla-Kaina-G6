{% extends 'base.html' %}
{% block content %}
<h2>{{ title }}</h2>
{% if not form.fields.person.queryset.exists %}
  <div class="msg error">You have no people yet. <a href="{% url 'person_list' %}">Add a person first.</a></div>
{% endif %}
<form method="post">{% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}
    <label>{{ field.label }}</label>{{ field }}{{ field.errors }}
  {% endfor %}
  <button type="submit">Save</button>
  <a href="{% url 'transaction_list' %}">Cancel</a>
</form>
{% endblock %}
