{% extends 'base.html' %}
{% block content %}
<h2>Create an account</h2>
<form method="post">{% csrf_token %}
  {% for field in form %}
    <label>{{ field.label }}</label>{{ field }}{{ field.errors }}
  {% endfor %}
  <button type="submit">Register</button>
</form>
<p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
